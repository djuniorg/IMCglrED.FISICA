<!DOCTYPE html>
<html lang="Pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Login - Sistema IMC</title>
</head>
<body>
    <main id="container">
        <section id="img">
            <img src="images/ilustration.svg">
        </section>

        <section id="calculator">
            <form id="form">
                <h1 id="title">Login</h1>

                <div class="input-box">
                    <label for="ra">RA</label>
                    <div class="input-field">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="ra" required>
                        <span>
                            RA
                        </span>
                    </div>
                </div>

                <div class="input-box">
                    <label for="password">Senha</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" required>
                        <span>
                            ***
                        </span>
                    </div>
                </div>

                <button id="login">Entrar</button>
            </form>
            <div id="infos" class="hidden">
                <div id="result">
                    <div id="bmi">
                        <span id="message"></span>
                    </div>
                </div>
            </div>
            <div id="change-password" class="hidden">
                <h2>Primeiro Acesso - Defina sua Senha</h2>
                <div class="input-box">
                    <label for="new-password">Nova Senha</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="new-password" required>
                        <span>
                            ***
                        </span>
                    </div>
                </div>
                <button id="update-password">Atualizar Senha</button>
            </div>
        </section>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
